name: Float

options:
  bundleIdPrefix: com.leonardocezar
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_HARDENED_RUNTIME: "NO"
    DEAD_CODE_STRIPPING: "YES"

targets:
  Float:
    type: application
    platform: macOS
    sources:
      - path: Sources/Float
      - path: Resources/Assets.xcassets
        buildPhase: resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: Float
        CFBundleDisplayName: Float
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: ""
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: Resources/Float.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
        com.apple.security.network.server: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leonardocezar.Float
        GENERATE_INFOPLIST_FILE: "NO"
        ENABLE_PREVIEWS: "YES"
        COMBINE_HIDPI_IMAGES: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  FloatTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/FloatTests
    dependencies:
      - target: Float
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leonardocezar.FloatTests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  Float:
    build:
      targets:
        Float: all
        FloatTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FloatTests
